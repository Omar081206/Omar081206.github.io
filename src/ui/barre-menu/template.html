<header class="barre-menu">
  <div class="barre-menu__groupe">
    <button type="button" class="barre-menu__marque" data-action="marque"><svg class="icone barre-menu__logo" aria-hidden="true"><use href="#i-logo"></use></svg>NOS</button>
    <span class="barre-menu__appli">{{appli}}</span>
  </div>
  <div class="barre-menu__groupe barre-menu__groupe--droite">
    <button type="button" class="barre-menu__bascule barre-menu__bascule--ordinateur" data-reglage="glitch" title="Glitchs du titre">GLITCH</button>
    <button type="button" class="barre-menu__bascule" data-reglage="son" title="Bruitages">SON</button>
    <button type="button" class="barre-menu__bascule" data-reglage="musique" title="Musique d'ambiance">MUSIQUE</button>
    <button type="button" class="barre-menu__bascule barre-menu__bascule--ordinateur" data-reglage="animation" title="Mouvements de l'arrière-plan">ANIM. FOND</button>
    <span class="barre-menu__statut">NET <b class="barre-menu__valeur">5G</b></span>
    <span class="barre-menu__statut">BAT <b class="barre-menu__valeur">87%</b></span>
    <span class="barre-menu__statut barre-menu__statut--horloge">{{heure}}</span>
  </div>
</header>
