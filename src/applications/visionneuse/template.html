<dialog class="visionneuse" aria-labelledby="visionneuse-legende">
  <div class="visionneuse__barre">
    <p class="visionneuse__legende" id="visionneuse-legende">Capture</p>
    <button type="button" class="action visionneuse__echelle" data-action="echelle" aria-pressed="false">Taille réelle</button>
    <button type="button" class="bouton-icone" data-action="precedente" aria-label="Capture précédente"><svg class="icone bouton-icone__icone" aria-hidden="true"><use href="#i-prev"></use></svg></button>
    <button type="button" class="bouton-icone" data-action="suivante" aria-label="Capture suivante"><svg class="icone bouton-icone__icone" aria-hidden="true"><use href="#i-next"></use></svg></button>
    <button type="button" class="bouton-icone" data-action="fermer" aria-label="Fermer l'agrandissement"><svg class="icone bouton-icone__icone" aria-hidden="true"><use href="#i-close"></use></svg></button>
  </div>
  <div class="visionneuse__corps" tabindex="0"></div>
</dialog>
