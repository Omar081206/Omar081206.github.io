<div class="demarrage" role="status" aria-label="Démarrage du système">
  <div class="demarrage__interieur">
    <div class="demarrage__entete">
      <svg class="demarrage__titre" viewBox="-10 -10 1070 310" role="img" aria-label="Omar"><image x="66.4" y="64" width="917.3" height="191" href="{{titre}}"/></svg>
      <p class="demarrage__marque"><svg class="icone demarrage__embleme" aria-hidden="true"><use href="#i-logo"></use></svg><span class="demarrage__version">Portfolio // NOS v0.1</span></p>
    </div>
    <div class="demarrage__journal"></div>
    <div class="demarrage__barre"><span class="demarrage__remplissage"></span></div>
    <div class="demarrage__pied">
      <span>CHARGEMENT <span class="demarrage__pourcentage">0%</span></span>
      <button type="button" class="demarrage__passer" aria-keyshortcuts="Escape">PASSER <span class="demarrage__touche">[Échap]</span></button>
    </div>
  </div>
</div>
